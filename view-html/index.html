<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Renderer</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .file-btn {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      transition: background-color 0.15s ease;
    }

    .file-btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    input[type="file"] {
      display: none;
    }

    .url-box {
      display: inline-flex;
      align-items: stretch;
      width: min(320px, 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--bg);
      overflow: hidden;
    }

    .url-box input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      padding: 8px 10px;
    }

    .url-box input::placeholder {
      color: var(--muted);
    }

    .url-box button {
      background-color: var(--surface);
      border: none;
      border-left: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .url-box button:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .drop-zone .error {
      margin-top: 14px;
      color: #f87171;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .mode-switch {
      display: inline-flex;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }

    .mode-switch button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
    }

    .mode-switch button.active {
      background-color: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .meta {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45vw;
    }

    main {
      flex: 1;
      position: relative;
      background-color: #ffffff;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    #placeholder {
      position: absolute;
      inset: 0;
      background-color: var(--bg);
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 12px;
    }

    #placeholder.hidden {
      display: none;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
    }

    .drop-zone h2 {
      margin: 0 0 8px 0;
      color: var(--text);
      font-size: 18px;
    }

    .drop-zone p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    #shadow-host {
      width: 100%;
      min-height: 100%;
      background: #fff;
      color: #000;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <label class="file-btn">
      <span>Open HTML File</span>
      <input type="file" id="fileInput" accept=".html,.htm,text/html" />
    </label>

    <div class="url-box">
      <input type="url" id="urlInput" placeholder="https://example.com/page.html" spellcheck="false" autocapitalize="off" autocomplete="off" enterkeyhint="go" aria-label="URL of an HTML page" />
      <button type="button" id="btnOpenUrl">Open URL</button>
    </div>

<!--    <div class="mode-switch" role="group" aria-label="Render mode">-->
<!--      <button type="button" id="btnIframe" class="active">Iframe (Full Isolation)</button>-->
<!--      <button type="button" id="btnShadow">Shadow DOM (In-Place)</button>-->
<!--    </div>-->

    <div class="meta" id="fileName">Nothing loaded</div>
  </header>

  <main id="dropArea">
    <div id="placeholder">
      <div class="drop-zone">
        <h2>Render HTML in Place</h2>
        <p>Tap <strong>Open HTML File</strong> above to pick an <code>.html</code> file from your device or Files app, drag and drop a file or a link here, or paste a URL to render a remote page.</p>
        <div id="loadError" class="error hidden"></div>
      </div>
    </div>

    <iframe id="iframeViewer" class="hidden" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
    <div id="shadow-host" class="hidden"></div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const btnOpenUrl = document.getElementById('btnOpenUrl');
    const btnIframe = document.getElementById('btnIframe');
    const btnShadow = document.getElementById('btnShadow');
    const fileNameDisplay = document.getElementById('fileName');
    const placeholder = document.getElementById('placeholder');
    const loadError = document.getElementById('loadError');
    const iframeViewer = document.getElementById('iframeViewer');
    const shadowHost = document.getElementById('shadow-host');
    const dropArea = document.getElementById('dropArea');

    let currentHtml = '';
    let loadToken = 0; // superseeded async loads are dropped
    let renderMode = 'iframe'; // 'iframe' or 'shadow'
    const shadowRoot = shadowHost.attachShadow({ mode: 'open' });

    function renderContent() {
      if (!currentHtml) return;

      placeholder.classList.add('hidden');
      loadError.classList.add('hidden');

      if (renderMode === 'iframe') {
        shadowHost.classList.add('hidden');
        shadowRoot.innerHTML = '';
        iframeViewer.classList.remove('hidden');
        iframeViewer.srcdoc = currentHtml;
      } else {
        iframeViewer.classList.add('hidden');
        iframeViewer.srcdoc = '';
        shadowHost.classList.remove('hidden');

        // Parse HTML so styles and scripts execute cleanly inside Shadow DOM
        const parser = new DOMParser();
        const doc = parser.parseFromString(currentHtml, 'text/html');

        shadowRoot.innerHTML = '';

        // Copy head styles/links into shadowRoot
        doc.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(node => {
          shadowRoot.appendChild(node.cloneNode(true));
        });

        // Create wrapper for body content
        const bodyContainer = document.createElement('div');
        bodyContainer.innerHTML = doc.body.innerHTML;
        shadowRoot.appendChild(bodyContainer);

        // Re-create and execute inline scripts inside Shadow DOM context
        const scripts = doc.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => {
            newScript.setAttribute(attr.name, attr.value);
          });
          newScript.textContent = oldScript.textContent;
          shadowRoot.appendChild(newScript);
        });
      }
    }

    function loadFile(file) {
      if (!file) return;
      const token = ++loadToken;
      const reader = new FileReader();
      reader.onload = (e) => {
        if (token !== loadToken) return; // a newer load has started meanwhile
        saveFile(file.name, e.target.result);
        openFile(file.name, e.target.result);
      };
      reader.readAsText(file);
    }

    // localStorage values are stored gzipped and base64-encoded, prefixed to
    // tell them apart from values written by older versions (raw HTML).
    const GZIP_PREFIX = 'gzip:';

    async function compress(text) {
      if (typeof CompressionStream === 'undefined') return null;
      const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    async function decompress(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }

    function bytesToBase64(bytes) {
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToBytes(str) {
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function saveFile(name, html) {
      try {
        let value = html; // Fallback: store as-is when compression is unavailable
        const compressed = await compress(html);
        if (compressed !== null) {
          value = GZIP_PREFIX + bytesToBase64(compressed);
        }
        localStorage.setItem(name, value);
      } catch (err) {
        // Quota exceeded or storage unavailable — viewing still works without persistence
        console.warn('Could not save "' + name + '" to localStorage:', err);
      }
    }

    function openFile(name, html) {
      openContent(name, html, '#file=' + encodeURIComponent(name), false);
    }

    // Remote pages are never written to localStorage — they are re-fetched
    // on every visit through the #url= hash. They also run in a stricter
    // sandbox (no allow-same-origin) so their scripts cannot read this
    // site's localStorage, where opened files are kept.
    function openUrl(url, html) {
      openContent(url, html, '#url=' + encodeURIComponent(url), true);
    }

    function openContent(name, html, hash, remote) {
      currentHtml = html;
      fileNameDisplay.textContent = name;
      iframeViewer.setAttribute('sandbox', remote
        ? 'allow-scripts allow-forms allow-modals allow-popups'
        : 'allow-scripts allow-forms allow-modals allow-popups allow-same-origin');
      history.replaceState(null, '', hash);
      renderContent();
    }

    function showError(message) {
      loadError.textContent = message;
      loadError.classList.remove('hidden');
      placeholder.classList.remove('hidden');
    }

    function normalizeUrl(value) {
      if (!/^https?:\/\//i.test(value)) {
        // Scheme present but not http(s) — not supported
        if (/^[a-z][a-z0-9+.-]*:/i.test(value)) return null;
        value = 'https://' + value;
      }
      try {
        return new URL(value).href;
      } catch (err) {
        return null;
      }
    }

    // Give remote pages a <base> pointing at their own URL so relative
    // resources resolve against the source site, not this viewer
    function withBase(html, url) {
      if (/<base\s/i.test(html)) return html; // respect the page's own <base>
      const tag = '<base href="' + url.replace(/"/g, '&quot;') + '">';
      if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, (head) => head + tag);
      if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, (htmlTag) => htmlTag + '<head>' + tag + '</head>');
      return tag + html;
    }

    async function fetchAndOpenUrl(rawUrl) {
      const token = ++loadToken;
      const url = normalizeUrl(rawUrl);
      if (!url) {
        fileNameDisplay.textContent = 'Invalid URL';
        showError('Invalid URL: ' + rawUrl);
        return;
      }
      fileNameDisplay.textContent = 'Loading ' + url + '…';
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error('HTTP ' + response.status + (response.statusText ? ' ' + response.statusText : ''));
        }
        const html = await response.text();
        if (token !== loadToken) return; // a newer load has started meanwhile
        openUrl(url, withBase(html, url));
      } catch (err) {
        if (token !== loadToken) return;
        fileNameDisplay.textContent = 'Could not load ' + url;
        console.warn('Could not load "' + url + '":', err);
        showError('Could not load ' + url + '. ' + err.message +
          (err instanceof TypeError ? ' The server may not allow cross-origin (CORS) access to the page.' : ''));
      }
    }

    // Restore content referenced by the URL hash:
    // #file=<name> — from localStorage, #url=<url> — fetched fresh, never cached
    async function restoreFromHash() {
      const params = new URLSearchParams(location.hash.slice(1));
      const name = params.get('file');
      if (name) {
        let saved = null;
        try {
          saved = localStorage.getItem(name);
        } catch (err) {
          return;
        }
        if (saved === null) return;
        if (saved.startsWith(GZIP_PREFIX)) {
          try {
            saved = await decompress(base64ToBytes(saved.slice(GZIP_PREFIX.length)));
          } catch (err) {
            console.warn('Could not decompress "' + name + '" from localStorage:', err);
            return;
          }
        }
        openFile(name, saved);
        return;
      }
      const url = params.get('url');
      if (url) {
        urlInput.value = url;
        fetchAndOpenUrl(url);
      }
    }

    fileInput.addEventListener('change', (e) => {
      loadFile(e.target.files[0]);
    });

    btnOpenUrl.addEventListener('click', () => {
      const value = urlInput.value.trim();
      if (value) fetchAndOpenUrl(value);
    });

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnOpenUrl.click();
    });

    // Mode switch buttons are currently commented out in the markup
    if (btnIframe && btnShadow) {
      btnIframe.addEventListener('click', () => {
        if (renderMode === 'iframe') return;
        renderMode = 'iframe';
        btnIframe.classList.add('active');
        btnShadow.classList.remove('active');
        renderContent();
      });

      btnShadow.addEventListener('click', () => {
        if (renderMode === 'shadow') return;
        renderMode = 'shadow';
        btnShadow.classList.add('active');
        btnIframe.classList.remove('active');
        renderContent();
      });
    }

    // Drag and drop support
    dropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        loadFile(e.dataTransfer.files[0]);
        return;
      }
      // Dropped link (address bar, text link) instead of a file
      const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
      const url = text.split('\n').map((line) => line.trim()).find((line) => line && !line.startsWith('#'));
      if (url) fetchAndOpenUrl(url);
    });

    restoreFromHash();
  </script>
</body>
</html>
